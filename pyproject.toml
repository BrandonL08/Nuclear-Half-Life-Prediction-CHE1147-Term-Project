
[project]
name = "nuclear-half-life-prediction"
version = "1.0.0"
description = "Machine learning for nuclear half-life prediction - CHE1147 Term Project, University of Toronto"
readme = "README.md"
requires-python = ">=3.14.5,<3.15"

dependencies = [
    "numpy==2.5.5",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
    "scikit-learn==1.9.1",
    "xgboost==3.4.1",
    "ipython==9.18.1",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "jupyter==1.1.1",
]

[tool.uv]
package = false
link-mode = "copy"